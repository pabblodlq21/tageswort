# Proyecto de Xcode generado con XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Genera Tageswort.xcodeproj ya configurado: app + widget, archivos compartidos,
# esquema de URL y empaquetado del widget. No tienes que tocar targets a mano.
#
#   brew install xcodegen      # una sola vez
#   xcodegen generate          # crea Tageswort.xcodeproj
#   open Tageswort.xcodeproj   # ábrelo y pulsa ▶
#
# Antes de correr en un iPhone real: selecciona el target Tageswort → Signing &
# Capabilities → marca "Automatically manage signing" y elige tu Team (tu Apple ID
# gratuito sirve). Repite para el target del widget. Cambia PRODUCT_BUNDLE_IDENTIFIER
# abajo si el identificador ya está en uso.

name: Tageswort

options:
  bundleIdPrefix: com.pabblodlq21
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad

targets:

  Tageswort:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: TageswortWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pabblodlq21.tageswort
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tageswort
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        # Esquema de URL para que al tocar el widget se abra la app y pronuncie.
        CFBundleURLTypes:
          - CFBundleURLName: com.pabblodlq21.tageswort
            CFBundleURLSchemes:
              - tageswort

  TageswortWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pabblodlq21.tageswort.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Tageswort
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
